  <g id="text_32">
   <text style="fill: #444444; font: 9.2px 'DejaVu Sans'" transform="translate(56.16 497.982387)">Saved summary only: q and PF order are unchanged; some PF costs and candidate rankings change.</text>
   <text style="fill: #444444; font: 9.2px 'DejaVu Sans'" transform="translate(56.16 509.682487)">Replacement sensitivity, not isolated model-error validation. Scope overlap is not 100 independent experiments.</text>
   <text style="fill: #444444; font: 9.2px 'DejaVu Sans'" transform="translate(56.16 521.382587)">Limits retained: profile/runtime differences; S4 hypothesis; missing initial final gate; pending old-profile axes.</text>
   <text style="fill: #444444; font: 9.2px 'DejaVu Sans'" transform="translate(56.16 533.082688)">Fixed H6/H8 domains; saved union8/union6 PR n32; no population-mean, unseen-event, or global-optimum guarantee.</text>
  </g>
