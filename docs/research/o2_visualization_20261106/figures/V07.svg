  <g id="text_36">
   <text style="fill: #333333; font: 8.4px 'DejaVu Sans'" transform="translate(37.8 606.510037)">XP04 · Original matching classification: CONTEXTUAL. Tail, basis, law, control, H/state/reference and price cohorts are not jointly matched.</text>
   <text style="fill: #333333; font: 8.4px 'DejaVu Sans'" transform="translate(37.8 617.192738)">This table contains no new numerical cost comparison. It does not establish a DF–Pauli representation-only causal effect, a universal pure-RTE result or a common winner.</text>
   <text style="fill: #333333; font: 8.4px 'DejaVu Sans'" transform="translate(37.8 627.875437)">The exact original matching row and scientific/result references are retained in FIGURE_MANIFEST.csv and FIGURE_VALIDATION.json.</text>
