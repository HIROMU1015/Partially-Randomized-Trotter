   <text style="fill: #333333; font: 8.4px 'DejaVu Sans'" transform="translate(27.72 477.458363)">PR m5/p8/q1/R32/K4 vs PF B0I/m5/p15/q1. PR error bar: ±1 saved paired-price G SE = 103180211675.02368 RZ×shot. PF sample SE is null, not zero.</text>
